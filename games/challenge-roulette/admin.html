<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenge Roulette – Admin</title>
  <link rel="stylesheet" href="../../css/shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar"><a href="index.html">← Back to Roulette</a><h1>🔒 Admin Panel</h1></div>
  <main>
    <section id="login" class="card center">
      <h3>Enter passcode</h3>
      <div class="row">
        <input type="password" id="passcode" placeholder="Passcode" autocomplete="off">
        <button class="btn" id="login-btn">Unlock</button>
      </div>
      <p id="login-msg" class="msg"></p>
    </section>

    <section id="panel" class="card hidden">
      <h3>Add a challenge</h3>
      <div class="row add-row">
        <input type="text" id="new-challenge" maxlength="140" placeholder="Type a challenge…">
        <select id="new-level">
          <option>Mild</option>
          <option>Medium</option>
          <option>Wild</option>
        </select>
        <button class="btn secondary" id="add-btn">Add</button>
      </div>
      <p class="muted small">Custom challenges are saved in this browser only.</p>
      <ul id="custom-list" class="custom-list"></ul>
      <div class="row">
        <button class="btn secondary hidden" id="reset-btn">Clear custom challenges</button>
        <button class="btn secondary" id="logout-btn">Lock</button>
      </div>
    </section>
  </main>
  <script src="../../js/admin-config.js"></script>
  <script src="challenges.js"></script>
  <script src="admin.js"></script>
</body>
</html>
